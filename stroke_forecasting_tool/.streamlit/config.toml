[server]
maxUploadSize = 1024
# Serves ./static/ at app/static/<file> -- used for the heart-shaped
# navigation loader (static/heart-loader.webp), referenced by URL rather
# than base64 so it's fetched and cached once, not re-sent inline on
# every rerun.
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#00897B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E1E5F"
borderColor = "#E2E8F0"
linkColor = "#00897B"
linkUnderline = false

greenColor = "#047857"
greenBackgroundColor = "#D1FAE5"
greenTextColor = "#047857"
redColor = "#C0392B"
redBackgroundColor = "#FBEAE8"
redTextColor = "#C0392B"
orangeColor = "#C17D0C"
orangeBackgroundColor = "#FEF9E7"
orangeTextColor = "#C17D0C"
blueColor = "#1E1E5F"
blueBackgroundColor = "#EAEAF8"
blueTextColor = "#1E1E5F"
violetColor = "#6B2D8B"
violetBackgroundColor = "#F5EEF8"
violetTextColor = "#6B2D8B"
grayColor = "#94A3B8"

chartCategoricalColors = ["#00897B", "#6B2D8B", "#C17D0C", "#C0392B", "#00B5A3", "#1E1E5F"]

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["26px", "21px", "17px", "15px", "13px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

# Square corners everywhere (Swiss financial aesthetic) -- the login logo
# badge and user avatar are the sole exceptions, overridden explicitly with
# their own border-radius in inject_global_css()/auth.py's login CSS.
baseRadius = "0px"
buttonRadius = "0px"
showWidgetBorder = true
showSidebarBorder = true

dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"

[theme.sidebar]
backgroundColor = "#1E1E5F"
secondaryBackgroundColor = "#262670"
textColor = "#FFFFFF"
borderColor = "rgba(255,255,255,0.08)"
primaryColor = "#00B5A3"
linkColor = "#00B5A3"
